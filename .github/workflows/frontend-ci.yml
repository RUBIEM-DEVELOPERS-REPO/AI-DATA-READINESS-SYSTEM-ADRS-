name: Frontend CI

on:
  pull_request:
    paths:
      - "client/src/**"
      - "client/public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
  push:
    branches: ["dev", "main"]
    paths:
      - "client/src/**"
      - "client/public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (vulnerability scan)
        run: npx audit-ci --high

      - name: Build frontend
        run: npm run build
