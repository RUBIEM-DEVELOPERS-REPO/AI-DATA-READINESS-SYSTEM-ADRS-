name: Backend CI

on:
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  push:
    branches: ["dev", "main"]
    paths:
      - "server/**"
      - "shared/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SESSION_SECRET: ci-session-secret
      DEFAULT_TENANT: default

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (vulnerability scan)
        run: npx audit-ci --high

      - name: Typecheck
        run: npm run check

      - name: Run tests
        run: npm test
