apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: intellinexus-staging

namePrefix: staging-

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: intellinexus
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
  - target:
      kind: Namespace
      name: intellinexus
    patch: |
      - op: replace
        path: /metadata/name
        value: intellinexus-staging

configMapGenerator:
  - name: intellinexus-config
    literals:
      - NODE_ENV=staging
      - AI_PROVIDER=openai
      - JOB_QUEUE_BACKEND=pg
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.monitoring:4318
      - LOG_LEVEL=debug
