apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: intellinexus

resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml

patches:
  - target:
      kind: Deployment
      name: intellinexus
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi

configMapGenerator:
  - name: intellinexus-config
    literals:
      - NODE_ENV=production
      - AI_PROVIDER=openai
      - JOB_QUEUE_BACKEND=pg
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.monitoring:4318
      - LOG_LEVEL=warn
