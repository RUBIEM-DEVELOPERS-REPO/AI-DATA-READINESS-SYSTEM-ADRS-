groups:
  # ─── Application Availability ──────────────────────────────────────
  - name: intellinexus.availability
    rules:
      - alert: IntelliNexusDown
        expr: up{job="intellinexus"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "IntelliNexus API is down"
          description: "IntelliNexus API target {{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          rate(http_request_errors_total{job="intellinexus"}[5m])
          / rate(http_requests_total{job="intellinexus"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High HTTP error rate (>5%)"
          description: "IntelliNexus is returning errors at {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighP99Latency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job="intellinexus"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "P99 latency exceeds 5 seconds"
          description: "The 99th percentile request latency is {{ $value }}s."

  # ─── Resource Utilization ──────────────────────────────────────────
  - name: intellinexus.resources
    rules:
      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes{job="intellinexus"}
          / (1024 * 1024 * 1024) > 1.5
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "IntelliNexus memory usage above 1.5 GiB"
          description: "Process memory is {{ $value | humanize }} GiB."

      - alert: HighCpuUsage
        expr: rate(process_cpu_seconds_total{job="intellinexus"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "IntelliNexus CPU usage above 80%"
          description: "CPU utilization is at {{ $value | humanizePercentage }}."

  # ─── Pipeline Health ───────────────────────────────────────────────
  - name: intellinexus.pipeline
    rules:
      - alert: ExtractionQueueBacklog
        expr: intellinexus_job_queue_depth{status="queued"} > 50
        for: 15m
        labels:
          severity: warning
          team: data-engineering
        annotations:
          summary: "Extraction job queue backlog exceeds 50 jobs"
          description: "{{ $value }} jobs are queued and not being processed."

      - alert: ValidationTaskBacklog
        expr: intellinexus_validation_tasks_pending > 100
        for: 30m
        labels:
          severity: warning
          team: data-governance
        annotations:
          summary: "Over 100 validation tasks pending"
          description: "{{ $value }} validation tasks require human review."

      - alert: AIProviderCircuitOpen
        expr: intellinexus_circuit_breaker_state{service="ai_provider"} == 1
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "AI provider circuit breaker is OPEN"
          description: "AI provider calls are failing and the circuit breaker has tripped."

  # ─── Database ──────────────────────────────────────────────────────
  - name: intellinexus.database
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL exporter is down"
          description: "Cannot reach PostgreSQL metrics exporter."

      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL connection count above 80"
          description: "{{ $value }} active database connections detected."

  # ─── Tenant Isolation ──────────────────────────────────────────────
  - name: intellinexus.tenants
    rules:
      - alert: TenantContextMissing
        expr: rate(intellinexus_tenant_context_missing_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Requests arriving without tenant context"
          description: "{{ $value }} req/s hitting endpoints without a tenant context — potential isolation breach."
