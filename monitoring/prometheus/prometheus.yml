global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ─── IntelliNexus Application ───────────────────────────────────────
  - job_name: "intellinexus"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["intellinexus:5000"]
        labels:
          service: "intellinexus-api"
          environment: "production"

  # ─── PostgreSQL Exporter ────────────────────────────────────────────
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgresql"

  # ─── Node Exporter (host metrics) ──────────────────────────────────
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "infrastructure"

  # ─── Prometheus self-monitoring ─────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
